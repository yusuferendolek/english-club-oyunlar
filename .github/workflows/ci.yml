name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Static checks
        run: node scripts/check.js
      - name: Smoke test (every screen in headless Chrome)
        run: node scripts/smoke.js
