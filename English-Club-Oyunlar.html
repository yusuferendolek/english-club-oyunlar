<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Club – Grade 2</title>
<style>
:root{
  --ink:#2B2A4C; --bg:#FFF6E5; --paper:#FFFFFF; --muted:#6B6A8A;
  --red:#FF5A5F; --orange:#FF9F1C; --yellow:#FFD23F; --green:#2EC4B6; --lime:#8AC926;
  --blue:#3A86FF; --purple:#8338EC; --pink:#FF70A6; --sky:#4CC9F0;
  --bw:clamp(2px,.45vmin,4px);
  --font:"Nunito","Baloo 2","Segoe UI","Trebuchet MS",system-ui,sans-serif;
  --emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg) radial-gradient(rgba(43,42,76,.07) 1.5px,transparent 1.6px) 0 0/26px 26px;color:var(--ink);font-family:var(--font);font-weight:700;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
.e{font-family:var(--emoji);font-weight:400;line-height:1.2;font-style:normal}
b{font-weight:900}

/* ---------- top bar ---------- */
#topbar{flex:none;height:clamp(54px,9.5vh,86px);display:flex;align-items:center;gap:clamp(6px,1vmin,14px);padding:0 clamp(8px,1.4vmin,18px);background:var(--paper);border-bottom:var(--bw) solid var(--ink);position:relative;z-index:5}
.tb-btn{flex:none;height:70%;min-width:0;aspect-ratio:1;border:var(--bw) solid var(--ink);border-radius:28%;background:var(--paper);box-shadow:0 .35vmin 0 var(--ink);display:grid;place-items:center;font-size:clamp(18px,3.3vh,30px);cursor:pointer;padding:0}
.tb-btn:active{transform:translateY(2px);box-shadow:none}
.tb-btn svg{width:.95em;height:.95em}
.tb-title{display:flex;align-items:center;gap:.35em;font-size:clamp(18px,3.4vh,34px);font-weight:900;white-space:nowrap}
.tabs{flex:1;display:flex;gap:clamp(4px,.8vmin,10px);justify-content:center;min-width:0;overflow-x:auto;scrollbar-width:none;padding:4px 2px 7px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:var(--bw) solid var(--ink);border-radius:999px;background:var(--paper);padding:.3em .8em;font-size:clamp(13px,2.2vh,21px);font-weight:800;cursor:pointer;box-shadow:0 .3vmin 0 var(--ink);white-space:nowrap;display:flex;align-items:center;gap:.35em}
.tab.on{background:var(--yellow)}
.tools{display:flex;gap:clamp(4px,.8vmin,10px);height:100%;align-items:center;flex:none}
.star-btn{aspect-ratio:auto;padding:0 .45em;display:flex;gap:.25em;font-weight:900;font-size:clamp(16px,2.8vh,26px);background:#FFF4C2}
.star-btn.bump{animation:popIn .45s cubic-bezier(.3,1.6,.6,1)}
@media (max-width:1250px){.tb-title .t{display:none}.tab:not(.on) .l{display:none}}

/* ---------- stage & common ---------- */
#stage{flex:1;position:relative;min-height:0;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:clamp(10px,2vmin,26px);gap:clamp(8px,1.5vmin,18px);animation:fadeIn .25s ease}
.screen.nopad{padding:0}
.row{display:flex;gap:clamp(8px,1.4vmin,16px);align-items:center;justify-content:center;flex-wrap:wrap}
.card{background:var(--paper);border:var(--bw) solid var(--ink);border-radius:clamp(14px,2.6vmin,30px);box-shadow:0 .7vmin 0 var(--ink)}
.btn{color:var(--ink);border:var(--bw) solid var(--ink);border-radius:999px;background:var(--paper);box-shadow:0 .5vmin 0 var(--ink);padding:.4em 1em;font-weight:900;font-size:clamp(15px,2.5vmin,28px);cursor:pointer;transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:.35em;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(.4vmin);box-shadow:0 .1vmin 0 var(--ink)}
.btn.big{font-size:clamp(19px,3.4vmin,38px)}
.btn.y{background:var(--yellow)}.btn.g{background:#7BE0AD}.btn.b{background:#9BC7FF}.btn.p{background:#FFB3CF}.btn.o{background:#FFC478}.btn.v{background:#CDB4FF}
.btn.on{background:var(--yellow)}
.tab-pill{color:var(--ink);border:var(--bw) solid var(--ink);border-radius:999px;background:#fff;padding:.25em .85em;font-weight:900;font-size:clamp(14px,2.3vmin,25px);cursor:pointer;box-shadow:0 .35vmin 0 var(--ink);display:inline-flex;align-items:center;gap:.3em;white-space:nowrap}
.tab-pill.on{background:var(--yellow)}
.bubble{position:relative;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:clamp(14px,3vmin,34px);padding:.35em .85em;font-weight:900;box-shadow:0 .6vmin 0 var(--ink)}
.chip{display:inline-flex;align-items:center;gap:.35em;background:#FFF1C1;border:var(--bw) solid var(--ink);border-radius:999px;padding:.2em .8em;font-weight:900}
.chip.big{font-size:clamp(18px,3.6vmin,42px)}
.chip.xl{font-size:clamp(22px,5vmin,58px);box-shadow:0 .6vmin 0 var(--ink)}
.hint{color:var(--muted);font-weight:800}
.blank{display:inline-block;min-width:3.2em;border-bottom:.12em dashed currentColor;height:.9em;vertical-align:baseline}
.ctrl-br{position:absolute;right:clamp(10px,2vmin,24px);bottom:clamp(10px,2vmin,24px);display:flex;gap:clamp(6px,1.2vmin,14px);z-index:12;align-items:center}
.intro{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:4vmin 6vmin;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2vmin;z-index:5;max-width:90%}
.intro-e{font-size:clamp(50px,13vmin,150px)}
.intro h2{font-size:clamp(30px,7vmin,80px);font-weight:900}
.intro p{font-size:clamp(18px,3.4vmin,38px);color:var(--muted)}
.answer{font-size:clamp(24px,5.5vmin,64px);font-weight:900;color:var(--purple);text-align:center}
.pop{animation:popIn .45s cubic-bezier(.3,1.5,.6,1)}

/* ---------- keyframes ---------- */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8%) rotate(3deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8%)}40%{transform:translateX(8%)}60%{transform:translateX(-5%)}80%{transform:translateX(5%)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7%) scale(1.04,.97)}}
@keyframes droop{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(4%) rotate(4deg)}}
@keyframes nod{0%,100%{transform:rotate(0)}30%{transform:rotate(8deg) translateY(2%)}60%{transform:rotate(-2deg)}}
@keyframes pulse{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(6deg)}}
@keyframes sleepy{0%,100%{transform:rotate(-14deg) translateY(2%)}50%{transform:rotate(10deg)}}
@keyframes rumble{0%,60%,100%{transform:translate(0,0)}64%{transform:translate(-3%,1%)}68%{transform:translate(3%,-1%)}72%{transform:translate(-3%,1%)}76%{transform:translate(3%,0)}}
@keyframes tremble{0%,100%{transform:translate(0,0)}25%{transform:translate(-1.5%,1%)}50%{transform:translate(1.5%,-1%)}75%{transform:translate(-1%,-1%)}}
@keyframes wobble{0%,100%{transform:skewX(0) rotate(0)}25%{transform:skewX(-6deg) rotate(-4deg)}75%{transform:skewX(6deg) rotate(4deg)}}
@keyframes angry{0%,100%{transform:translateX(0) scale(1)}10%,30%,50%{transform:translateX(-4%) scale(1.05)}20%,40%{transform:translateX(4%) scale(1.05)}60%{transform:translateX(0) scale(1)}}
@keyframes silly{0%{transform:rotate(0)}40%{transform:rotate(370deg) scale(1.1)}55%{transform:rotate(350deg)}70%,100%{transform:rotate(360deg)}}
@keyframes floatUp{0%{transform:translateY(0) rotate(-10deg);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translateY(-105vh) rotate(15deg);opacity:0}}
@keyframes fallDown{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(105vh);opacity:0}}
@keyframes toastIn{0%{transform:translate(-50%,-50%) scale(.4) rotate(-8deg);opacity:0}15%{transform:translate(-50%,-50%) scale(1.12) rotate(2deg);opacity:1}25%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(.95)}}
.a-bounce{animation:bounce 1s ease-in-out infinite}
.a-droop{animation:droop 2.4s ease-in-out infinite}
.a-nod{animation:nod 1.4s ease-in-out infinite}
.a-pulse{animation:pulse 1.2s ease-in-out infinite}
.a-sleepy{animation:sleepy 3s ease-in-out infinite}
.a-rumble{animation:rumble 1.6s linear infinite}
.a-shake{animation:angry 1.2s ease-in-out infinite}
.a-wobble{animation:wobble 1.6s ease-in-out infinite}
.a-tremble{animation:tremble .18s linear infinite}
.a-spin{animation:silly 2.4s ease-in-out infinite}

/* ---------- FX layers / modal ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(40px,10vmin,130px);font-weight:900;color:var(--yellow);white-space:nowrap;pointer-events:none;opacity:0;z-index:61;text-shadow:.04em .04em 0 var(--ink),-.04em .04em 0 var(--ink),.04em -.04em 0 var(--ink),-.04em -.04em 0 var(--ink),0 .1em 0 var(--ink)}
#toast .e{text-shadow:none}
#toast.show{animation:toastIn 1.5s ease forwards}
#mini{position:fixed;left:50%;bottom:3vmin;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.5em 1.1em;border-radius:999px;font-size:clamp(14px,2.4vmin,24px);opacity:0;transition:opacity .25s;pointer-events:none;z-index:62}
#mini.show{opacity:1}
#modal{position:fixed;inset:0;background:rgba(43,42,76,.55);display:grid;place-items:center;z-index:40;animation:fadeIn .2s}
#modal[hidden]{display:none}
.modal-box{position:relative;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:clamp(16px,3vmin,34px);box-shadow:0 1vmin 0 var(--ink);padding:clamp(18px,3.5vmin,44px);width:min(92vw,980px);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:2vmin;align-items:center;text-align:center;animation:popIn .3s}
.modal-box h2{font-size:clamp(26px,5.5vmin,60px);font-weight:900}
.modal-x{position:absolute;top:1.5vmin;right:1.5vmin;width:clamp(40px,6vmin,64px);height:clamp(40px,6vmin,64px);border-radius:50%;border:var(--bw) solid var(--ink);background:#fff;font-size:clamp(18px,3vmin,30px);cursor:pointer;font-weight:900}
.slot{width:100%;border:var(--bw) solid var(--ink);border-radius:3vmin;background:#FFF4C2;padding:2vmin;overflow:hidden}
.slot-name{font-size:clamp(44px,12vmin,140px);font-weight:900;line-height:1.15;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:.3em}
.slot.win{background:#B9F3D0;animation:popIn .4s}
.names-ta{width:100%;min-height:38vh;font:inherit;font-size:clamp(18px,3vmin,30px);font-weight:800;border:var(--bw) solid var(--ink);border-radius:2vmin;padding:1.5vmin 2vmin;resize:vertical;color:var(--ink);user-select:text;-webkit-user-select:text}
.help-grid{display:grid;grid-template-columns:auto 1fr;gap:1.2vmin 3vmin;text-align:left;font-size:clamp(15px,2.5vmin,26px);align-items:center}
kbd{display:inline-block;border:2px solid var(--ink);border-bottom-width:4px;border-radius:.4em;padding:.05em .45em;background:#fff;font-family:var(--font);font-weight:900;font-size:.9em}
.help-note{font-size:clamp(14px,2.2vmin,22px);color:var(--muted);text-align:left;line-height:1.4}

/* ---------- home ---------- */
.home{align-items:center}
.home-head{text-align:center;flex:none;display:flex;flex-direction:column;align-items:center}
.home-head h1{font-size:clamp(28px,6.5vmin,76px);font-weight:900;display:flex;align-items:center;gap:.3em}
.home-head p{font-size:clamp(15px,2.8vmin,30px);color:var(--muted)}
.wave{display:inline-block;transform-origin:70% 80%;animation:wave 1.8s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}}
.tiles{flex:1;width:100%;max-width:170vh;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:clamp(10px,2vmin,24px);min-height:0}
.tile{position:relative;border:var(--bw) solid var(--ink);border-radius:clamp(16px,3vmin,34px);background:var(--c);box-shadow:0 .8vmin 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqh;padding:3% 3%;text-align:center;container-type:size;overflow:hidden;transition:transform .12s;min-height:0}
.tile:hover{transform:translateY(-.5vmin) rotate(-.6deg)}
.tile:active{transform:translateY(.5vmin);box-shadow:0 .2vmin 0 var(--ink)}
.tile .te{font-size:min(38cqh,50cqw);animation:float 3s ease-in-out infinite;animation-delay:var(--d)}
.tile .tt{display:flex;flex-direction:column;align-items:center;min-width:0}
.tile .tn{font-size:min(12cqh,14.5cqw);font-weight:900;line-height:1.05}
.tile .ts{font-size:min(7cqh,8.5cqw);font-weight:800;opacity:.72}
.tile .k{position:absolute;top:4%;right:5%;font-size:min(6.5cqh,8cqw);width:1.7em;height:1.7em;border-radius:50%;background:rgba(255,255,255,.75);display:grid;place-items:center;border:2px solid var(--ink);font-weight:900}

/* ---------- learn grid + detail ---------- */
.lgrid{flex:1;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),1fr);gap:clamp(8px,1.6vmin,18px);min-height:0}
.lcard{border:var(--bw) solid var(--ink);border-radius:clamp(12px,2.2vmin,26px);background:var(--paper);box-shadow:0 .6vmin 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqh;padding:0;min-height:0;min-width:0;overflow:hidden;container-type:size;transition:transform .12s}
.lcard:hover{transform:translateY(-.4vmin) rotate(-1deg)}
.lcard .e{font-size:min(50cqh,56cqw)}
.lcard .w{font-size:min(15cqh,14cqw);font-weight:900;line-height:1.1}
.lcard .num{font-size:min(56cqh,50cqw);font-weight:900;line-height:1}
.lcard .splat-wrap{height:60cqh;aspect-ratio:1}
.splat{width:100%;height:100%;display:block;overflow:visible}
.detail{position:absolute;inset:0;background:var(--bg);z-index:3;animation:fadeIn .2s}
.detail[hidden]{display:none}
.det-body{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2vmin 13vmin;container-type:size;overflow:hidden}
.detail.full .det-body{padding:0}
.det-stack{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2cqh;text-align:center;position:relative;z-index:1;animation:popIn .4s cubic-bezier(.3,1.4,.6,1)}
.det-word{font-size:min(14cqh,13cqw);font-weight:900;line-height:1.05}
.det-sent{font-size:min(8cqh,6.5cqw);font-weight:900;color:var(--purple)}
.det-sent small{font-size:.6em;color:var(--muted)}
.emo-big{font-size:min(34cqh,34cqw);display:inline-block}
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);width:clamp(48px,9vmin,96px);height:clamp(48px,9vmin,96px);border-radius:50%;border:var(--bw) solid var(--ink);background:var(--yellow);font-size:clamp(34px,7vmin,76px);font-weight:900;line-height:1;cursor:pointer;box-shadow:0 .5vmin 0 var(--ink);display:grid;place-items:center;z-index:4;padding:0 0 .12em}
.nav-arrow.left{left:2vmin}.nav-arrow.right{right:2vmin}
.det-tools{position:absolute;top:1.6vmin;right:1.6vmin;display:flex;gap:1vmin;z-index:5}
.floaties{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fl{position:absolute;bottom:-12%;animation:floatUp linear infinite}
.floaties{opacity:.55}
.floaties.down .fl{bottom:auto;top:-12%;animation-name:fallDown}
.items-row{display:flex;gap:3cqw;justify-content:center}
.item-card{display:flex;flex-direction:column;align-items:center;gap:.6cqh;background:#fff;border:var(--bw) solid var(--ink);border-radius:2vmin;padding:1.5cqh 2.5cqw;box-shadow:0 .5vmin 0 var(--ink);font-size:min(4.5cqh,3.2cqw);font-weight:900}
.item-card .e{font-size:min(13cqh,10cqw)}
.splat-big{position:relative;height:48cqh;aspect-ratio:1}
.splat-big .splat{animation:pulse 2.4s ease-in-out infinite}
.splat-word{position:absolute;inset:0;display:grid;place-items:center;font-size:min(10cqh,8cqw);font-weight:900;padding-top:4%}

/* ---------- weather scenes ---------- */
.scene{position:absolute;inset:0;overflow:hidden;container-type:size;background:var(--sky);isolation:isolate}
.scene::after{content:'';position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
.scene.flash::after{animation:flashA .7s ease-out}
@keyframes flashA{0%{opacity:0}6%{opacity:.85}16%{opacity:.1}26%{opacity:.7}100%{opacity:0}}
.cloud{position:absolute;left:0;width:calc(var(--s)*1cqmin);height:calc(var(--s)*.36cqmin);background:var(--cc,#fff);border-radius:999px;animation:drift linear infinite;filter:drop-shadow(0 .8cqmin 0 rgba(43,42,76,.13));z-index:2}
.cloud::before,.cloud::after{content:'';position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:52%;height:150%;left:14%;bottom:35%}
.cloud::after{width:38%;height:115%;right:14%;bottom:40%}
.cloud.still{animation:none}
@keyframes drift{from{transform:translateX(-60cqmin)}to{transform:translateX(calc(100cqw + 10cqmin))}}
.hill{position:absolute;border-radius:50%;background:var(--hc);z-index:3}
.hill.h1{left:-15%;width:75%;height:45cqh;bottom:-24cqh}
.hill.h2{right:-20%;width:85%;height:50cqh;bottom:-30cqh}
.prop{position:absolute;font-family:var(--emoji);line-height:1;z-index:4}
.prop.sway{transform-origin:50% 100%;animation:sway 1.8s ease-in-out infinite}
.prop.sway.fast{animation-duration:.9s}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(8deg)}}
.prop.flutter{animation:flutter 5s ease-in-out infinite}
@keyframes flutter{0%,100%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(9cqmin,-7cqmin) rotate(8deg)}50%{transform:translate(18cqmin,0) rotate(-6deg)}75%{transform:translate(9cqmin,6cqmin) rotate(6deg)}}
.prop.shiver{animation:tremble .15s linear infinite}
.prop.throb{animation:pulse 1.4s ease-in-out infinite}
.sun-svg{position:absolute;width:30cqmin;right:7cqw;top:6cqh;z-index:1;overflow:visible}
.sun-svg .rays{animation:spin 18s linear infinite;transform-box:fill-box;transform-origin:center}
.sun-svg .face{animation:bounce 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.drop{position:absolute;top:-8cqh;width:.55cqmin;height:5cqmin;border-radius:999px;background:linear-gradient(rgba(255,255,255,0),#E1F5FE);animation:fall linear infinite;z-index:5}
@keyframes fall{to{transform:translate(-4cqmin,118cqh)}}
.flake{position:absolute;top:-5cqh;border-radius:50%;background:#fff;animation:snow linear infinite;box-shadow:0 0 .6cqmin rgba(255,255,255,.9);z-index:5}
@keyframes snow{0%{transform:translate(0,0)}25%{transform:translate(2.5cqmin,28cqh)}50%{transform:translate(-2cqmin,56cqh)}75%{transform:translate(2cqmin,84cqh)}100%{transform:translate(0,112cqh)}}
.leaf{position:absolute;left:0;font-family:var(--emoji);line-height:1;animation:blow linear infinite;z-index:6}
@keyframes blow{0%{transform:translate(-10cqw,0) rotate(0)}25%{transform:translate(20cqw,-6cqh) rotate(200deg)}50%{transform:translate(50cqw,5cqh) rotate(400deg)}75%{transform:translate(80cqw,-8cqh) rotate(600deg)}100%{transform:translate(115cqw,2cqh) rotate(800deg)}}
.gust{position:absolute;left:0;height:.9cqmin;width:28cqmin;border-radius:999px;background:rgba(255,255,255,.9);animation:gust linear infinite;z-index:6}
@keyframes gust{0%{transform:translateX(-40cqmin);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateX(110cqw);opacity:0}}
.ripple{position:absolute;width:10cqmin;height:2.6cqmin;border:.45cqmin solid rgba(255,255,255,.75);border-radius:50%;animation:ripple 1.4s ease-out infinite;z-index:4}
@keyframes ripple{from{transform:scale(.2);opacity:1}to{transform:scale(1.5);opacity:0}}
.bolt{position:absolute;width:11cqmin;opacity:0;filter:drop-shadow(0 0 2cqmin #FFF59D);z-index:3}
.scene.flash .bolt{animation:boltA .7s}
@keyframes boltA{0%,100%{opacity:0}5%,32%{opacity:1}16%{opacity:.3}}
.heat{position:absolute;width:3cqmin;height:22cqh;animation:rise 2.6s ease-in infinite;z-index:5;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}30%{opacity:.9}100%{transform:translateY(-30cqh);opacity:0}}
.icicles{position:absolute;top:0;left:0;width:100%;height:13cqh;z-index:6}
.scene-cap{position:absolute;left:0;right:0;bottom:3.5cqh;display:flex;flex-direction:column;align-items:center;gap:1.8cqh;z-index:9;pointer-events:none}
.scene-label{background:#fff;border:var(--bw) solid var(--ink);border-radius:999px;padding:.12em .8em;font-size:min(10cqh,8cqw);font-weight:900;box-shadow:0 .7vmin 0 var(--ink);animation:popIn .45s cubic-bezier(.3,1.5,.6,1)}
.scene-cap .chip{font-size:min(5.5cqh,4cqw)}
.wm-host{position:absolute;inset:0;container-type:size}
.wm-top{position:absolute;top:4cqh;left:0;right:0;display:flex;justify-content:center;z-index:9}
.wm-top .scene-label{font-size:min(13cqh,10cqw)}
.wm-bottom{position:absolute;bottom:15cqh;left:0;right:0;display:flex;justify-content:center;z-index:9}
.wm-bottom .chip{font-size:min(7cqh,4.8cqw);animation:popIn .5s .2s both}

/* ---------- today ---------- */
.today{justify-content:center}
.trow{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.4vmin;padding:1.4vmin 2.4vmin;min-height:0}
.trow-head{display:flex;align-items:center;gap:2vmin;flex-wrap:wrap}
.tq{font-size:clamp(18px,3.4vmin,38px);font-weight:900;color:var(--muted)}
.tans{font-size:clamp(22px,4.6vmin,52px);font-weight:900;color:var(--purple)}
.tpills{display:flex;flex-wrap:wrap;gap:1vmin}
.pill{color:var(--ink);border:var(--bw) solid var(--ink);border-radius:999px;background:#fff;padding:.25em .75em;font-weight:900;font-size:clamp(15px,2.8vmin,32px);cursor:pointer;box-shadow:0 .4vmin 0 var(--ink);display:inline-flex;align-items:center;gap:.3em}
.pill.on{background:var(--yellow);transform:translateY(-.3vmin) scale(1.05)}

/* ---------- peek-a-boo ---------- */
.peek{flex-direction:row;align-items:center;justify-content:center}
.peek-box{position:relative;height:100%;max-height:100%;aspect-ratio:1;overflow:hidden;container-type:size;flex:none;background:#E8F7FF}
.peek-content{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#fff 0 40%,#E3F2FD 75%)}
.peek-content>.e{font-size:56cqmin}
.peek-tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);z-index:20}
.ptile{border:2px solid rgba(43,42,76,.45);background:var(--tc);font-size:9cqmin;font-weight:900;color:#fff;cursor:pointer;transition:transform .35s,opacity .35s;text-shadow:0 .5cqmin 0 rgba(43,42,76,.5);padding:0}
.ptile:hover{filter:brightness(1.12)}
.ptile.gone{transform:rotateY(90deg) scale(.5);opacity:0;pointer-events:none}
.peek-side{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;text-align:center}
.peek-q{font-size:clamp(22px,4.6vmin,54px)}
.frame{font-size:clamp(18px,3.6vmin,42px);font-weight:900;color:var(--muted)}
.peek-ans{min-height:1.4em;font-size:clamp(20px,4vmin,48px)}
.peek-btns{display:flex;flex-wrap:wrap;gap:1.2vmin;justify-content:center}
.hint-bubble{font-size:clamp(20px,4vmin,46px);color:var(--pink)}

/* ---------- weather news ---------- */
.news-head{display:flex;align-items:center;gap:2vmin;background:var(--red);color:#fff;border:var(--bw) solid var(--ink);border-radius:2vmin;padding:.8vmin 2vmin;box-shadow:0 .6vmin 0 var(--ink);flex:none}
.news-title{font-size:clamp(22px,4.6vmin,54px);font-weight:900;letter-spacing:.04em;flex:1}
.news-day{font-size:clamp(14px,2.6vmin,30px);font-weight:900}
.live{display:inline-flex;align-items:center;gap:.4em;background:#fff;color:var(--red);border-radius:999px;padding:.15em .7em;font-weight:900;font-size:clamp(13px,2.2vmin,24px)}
.live i{width:.7em;height:.7em;border-radius:50%;background:var(--red);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.news-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:1.6vmin;min-height:0}
.city{border:var(--bw) solid var(--ink);border-radius:2.4vmin;background:linear-gradient(#E3F2FD,#fff);box-shadow:0 .6vmin 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;container-type:size;min-height:0;gap:2cqh;padding:0}
.city .e{font-size:min(46cqh,40cqw);animation:float 3s ease-in-out infinite}
.city b{font-size:min(15cqh,13cqw)}
.city .cwl{font-size:min(10cqh,9cqw);color:var(--muted)}
.city.on{background:var(--yellow);transform:scale(1.04)}
.news-foot{display:flex;align-items:center;gap:2vmin;flex:none;flex-wrap:wrap;justify-content:center}
.news-frame{font-size:clamp(18px,3.8vmin,44px);font-weight:900;flex:1;text-align:center;min-width:50%}
.news-rep{font-size:clamp(18px,3.4vmin,38px);font-weight:900}

/* ---------- feelings games ---------- */
.fc-top{display:flex;align-items:center;justify-content:center;gap:2vmin;flex:none}
.fc-av{font-size:clamp(44px,10vmin,110px)}
.fc-q{font-size:clamp(24px,5.5vmin,64px)}
.fc-grid{flex:1;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(2,1fr);gap:1.4vmin;min-height:0}
.fc-face{border:var(--bw) solid var(--ink);border-radius:2vmin;background:#fff;box-shadow:0 .5vmin 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:1.5cqh .5cqw;container-type:size;min-height:0;overflow:hidden;gap:1cqh}
.fc-face .e{font-size:min(42cqh,62cqw);margin-top:2cqh}
.fc-face b{font-size:min(11cqh,15cqw)}
.fc-names{display:flex;flex-wrap:wrap;gap:.25em;justify-content:center;font-size:min(8cqh,10cqw)}
.fc-names span{background:#E0F2FF;border:1.5px solid var(--ink);border-radius:999px;padding:0 .4em;font-weight:900;animation:popIn .4s}
.fc-count{font-size:min(16cqh,20cqw);font-weight:900;color:var(--red)}
.fc-face.hit{animation:popIn .4s;background:#FFF4C2}
.fc-ans{flex:none;text-align:center;font-size:clamp(20px,4.4vmin,50px);font-weight:900;color:var(--purple);min-height:1.3em}
.fc-ans small{color:var(--muted);font-size:.65em}
.fguess{align-items:center;justify-content:center}
.fg-title{font-size:clamp(24px,5.5vmin,62px)}
.fg-window{width:min(52vmin,60vw);aspect-ratio:1;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:radial-gradient(#fff,#FFF4C2);flex:none}
.fg-emo{font-size:min(38vmin,44vw);display:inline-block;transition:filter .3s,transform .3s}
.fg-emo.blurry{transition:none;filter:blur(30px);transform:scale(3.4) rotate(-25deg)}
.fg-emo.blurry.unblur{transition:filter 8s linear,transform 8s cubic-bezier(.25,.6,.3,1);filter:blur(0);transform:scale(1) rotate(0)}
.fg-ans{min-height:1.3em;display:flex;align-items:center;gap:2vmin;flex-wrap:wrap;justify-content:center}
.fsort{flex-direction:row;align-items:stretch}
.bin{flex:1;border:var(--bw) solid var(--ink);border-radius:3vmin;box-shadow:0 .7vmin 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:2vmin;gap:2vmin;min-width:0}
.bin.good{background:#C8F7DC}.bin.bad{background:#FFD3D6}
.bin-h{font-size:clamp(26px,6vmin,70px);font-weight:900;display:flex;align-items:center;gap:.3em}
.bin-items{display:flex;flex-wrap:wrap;gap:1vmin;justify-content:center;font-size:clamp(34px,8vmin,90px)}
.bin-items .e{animation:popIn .4s}
.fs-center{flex:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;min-width:0}
.fs-card{padding:3vmin 4vmin;display:flex;flex-direction:column;align-items:center;gap:1vmin;animation:popIn .4s}
.fs-card .e{font-size:clamp(70px,24vmin,260px)}
.fs-card b{font-size:clamp(22px,5vmin,58px)}
.fs-q{font-size:clamp(18px,3.6vmin,40px);font-weight:900;color:var(--muted);text-align:center}
.fs-card.fly-l{animation:flyL .35s ease-in forwards}.fs-card.fly-r{animation:flyR .35s ease-in forwards}
@keyframes flyL{to{transform:translateX(-60vw) scale(.3) rotate(-30deg);opacity:0}}
@keyframes flyR{to{transform:translateX(60vw) scale(.3) rotate(30deg);opacity:0}}

/* ---------- colors ---------- */
.spy-top{display:flex;align-items:center;gap:2vmin;flex:none;flex-wrap:wrap;justify-content:center}
.spy-eye{font-size:clamp(40px,9vmin,100px);animation:wiggle 2s ease-in-out infinite}
.spy-q{font-size:clamp(20px,4.4vmin,50px);flex:1;min-width:40%;text-align:center}
.cw{display:inline-block;padding:0 .4em;border-radius:.4em;border:var(--bw) solid var(--ink);animation:popIn .5s}
.spy-btns{display:flex;gap:1vmin;flex-wrap:wrap;justify-content:center}
.spy-field{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);container-type:size;background:linear-gradient(#FFFDF5,#FFF0D6);overflow:hidden}
.spy-item{position:relative;border:none;background:none;cursor:pointer;font-size:min(25cqh,13cqw);display:grid;place-items:center;padding:0;transition:transform .2s,opacity .3s}
.spy-item .e{display:inline-block;transform:rotate(var(--r)) translate(var(--x),var(--y))}
.spy-item:hover .e{filter:drop-shadow(0 0 .2em #FFD23F)}
.spy-item.no{animation:shake .45s}
.spy-item.tried .e{opacity:.45}
.spy-item.hint .e{animation:wiggle .45s 4}
.spy-item.found{z-index:3}
.spy-item.found .e{animation:popIn .6s;filter:drop-shadow(0 0 .25em #FFD23F)}
.spy-item.done .e{opacity:.4}
.spy-item.done::after{content:'✓';position:absolute;right:18%;top:8%;font-size:.45em;color:#1B9E5A;font-weight:900;font-family:var(--font)}
.spy-item.ring::before{content:'';position:absolute;inset:6% 16%;border:.6vmin dashed var(--red);border-radius:50%;animation:spin 6s linear infinite}
.hunt{align-items:center;justify-content:center;text-align:center;transition:background .4s,color .4s}
.hunt-txt{font-size:clamp(34px,9vmin,110px);font-weight:900;line-height:1.15;animation:popIn .5s}
.hunt-txt small{font-size:.6em}
.hunt-cw{display:inline-block;padding:0 .3em;border-radius:.3em;background:rgba(255,255,255,.25);border:var(--bw) solid currentColor}
.hunt-timer{width:clamp(80px,18vmin,200px);height:clamp(80px,18vmin,200px);position:relative;display:grid;place-items:center;font-size:clamp(34px,8vmin,90px);font-weight:900}
.hunt-timer svg{position:absolute;inset:0;transform:rotate(-90deg)}
.magic{align-items:center;justify-content:center}
.mix-row{display:flex;align-items:center;justify-content:center;gap:3vmin;width:100%}
.mix-cell{display:flex;flex-direction:column;align-items:center;gap:1vmin;width:min(27vmin,22vw);transition:transform .7s cubic-bezier(.5,0,.5,1),opacity .7s}
.mix-cell .splat-box{width:100%;aspect-ratio:1;position:relative}
.mix-cell .lbl{font-size:clamp(20px,4.6vmin,54px);font-weight:900}
.mix-op{font-size:clamp(40px,10vmin,120px);font-weight:900}
.mix-row.mixing .ma{transform:translateX(70%) scale(.3) rotate(220deg);opacity:0}
.mix-row.mixing .mb{transform:translateX(-70%) scale(.3) rotate(-220deg);opacity:0}
.mix-q{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(40px,11vmin,130px);font-weight:900;color:#fff;text-shadow:0 .5vmin 0 var(--ink)}
.mix-sent{font-size:clamp(22px,5vmin,60px);font-weight:900;color:var(--purple);min-height:1.3em;text-align:center}

/* ---------- animals ---------- */
.ani-det{display:flex;align-items:center;gap:4cqw}
.ani-det .emo-big{font-size:min(44cqh,36cqw)}
.sound-bubble{font-size:min(9cqh,6.5cqw);transform:rotate(-4deg);color:var(--red)}
.asnd{align-items:center;justify-content:center}
.asnd-q{font-size:clamp(24px,5.4vmin,62px)}
.asnd-main{display:flex;align-items:center;gap:4vmin}
.asnd-emo{font-size:clamp(90px,30vmin,330px);display:inline-block;transition:filter .6s}
.asnd-emo.sil{filter:brightness(0) opacity(.85)}
.asnd-sound{font-size:clamp(30px,8vmin,96px);color:var(--red);transform:rotate(-5deg)}
.asnd-ans{min-height:1.3em}
.miss-top{display:flex;align-items:center;justify-content:center;gap:2vmin;flex-wrap:wrap;flex:none}
.miss-q{font-size:clamp(22px,5vmin,58px)}
.miss-grid{flex:1;display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:2vmin;min-height:0;grid-auto-rows:1fr}
.mcard{border:var(--bw) solid var(--ink);border-radius:2.6vmin;background:#fff;box-shadow:0 .6vmin 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;container-type:size;min-height:0;gap:2cqh;padding:0;animation:popIn .4s backwards}
.mcard .e{font-size:min(55cqh,60cqw)}
.mcard b{font-size:min(14cqh,15cqw)}
.mcard.q{background:var(--yellow);cursor:pointer}
.mcard.q .qm{font-size:min(70cqh,70cqw);font-weight:900;animation:wiggle 1s ease-in-out infinite}
.mcard.found{background:#B9F3D0}
.eyes-shut{position:absolute;inset:0;background:#2B2A4C;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;z-index:10;animation:fadeIn .3s}
.eyes-shut[hidden]{display:none}
.eyes-shut .e{font-size:clamp(90px,26vmin,300px);animation:bounce 1.4s infinite}
.eyes-shut div{font-size:clamp(34px,9vmin,110px);font-weight:900}
.eyes-shut small{font-size:clamp(20px,4.5vmin,54px)}
.amove{align-items:center;justify-content:center}
.am-emo{font-size:clamp(110px,40vmin,440px);display:inline-block}
.am-txt{font-size:clamp(30px,8vmin,96px);font-weight:900;text-align:center;animation:popIn .45s}
.am-txt b{color:var(--red)}
.m-hop{animation:mhop .7s cubic-bezier(.3,0,.5,1) infinite}
@keyframes mhop{0%,100%{transform:translateY(0) scale(1.08,.92)}45%{transform:translateY(-30%) scale(.95,1.06)}}
.m-flap{animation:mflap .5s ease-in-out infinite}
@keyframes mflap{0%,100%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-12%) rotate(10deg)}}
.m-swim{animation:mswim 1.6s ease-in-out infinite}
@keyframes mswim{0%,100%{transform:translateX(-20%) rotate(6deg)}50%{transform:translateX(20%) rotate(-6deg)}}
.m-slither{animation:mslither 1s ease-in-out infinite}
@keyframes mslither{0%,100%{transform:skewX(-14deg) translateX(-6%)}50%{transform:skewX(14deg) translateX(6%)}}
.m-stomp{animation:mstomp 1s ease-in infinite}
@keyframes mstomp{0%,100%{transform:translateY(0) rotate(-6deg)}25%{transform:translateY(-10%) rotate(-6deg)}50%{transform:translateY(0) rotate(6deg) scale(1.05,.95)}75%{transform:translateY(-10%) rotate(6deg)}}
.m-dance{animation:mdance .8s ease-in-out infinite}
@keyframes mdance{0%,100%{transform:rotate(-15deg) translateX(-8%)}50%{transform:rotate(15deg) translateX(8%)}}
.m-wag{animation:wiggle .6s ease-in-out infinite}
.m-waddle{animation:mwaddle .5s ease-in-out infinite}
@keyframes mwaddle{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.m-roar{animation:mroar 1.2s ease-in-out infinite}
@keyframes mroar{0%,60%,100%{transform:scale(1)}20%{transform:scale(1.25)}30%{transform:scale(1.2) rotate(-4deg)}40%{transform:scale(1.25) rotate(4deg)}}

/* ---------- numbers ---------- */
.num-det{flex-direction:row;gap:5cqw}
.num-left{display:flex;flex-direction:column;align-items:center}
.num-big{font-size:min(50cqh,34cqw);font-weight:900;line-height:1;text-shadow:0 1.2cqh 0 var(--ink)}
.num-right{display:flex;flex-direction:column;align-items:center;gap:3cqh}
.tenframe{display:grid;grid-template-columns:repeat(5,min(11cqh,7.5cqw));gap:1cqh;padding:1.6cqh;background:#fff;border:var(--bw) solid var(--ink);border-radius:2vmin;box-shadow:0 .5vmin 0 var(--ink)}
.tf-cell{aspect-ratio:1;border:2px dashed #C9C6E0;border-radius:1vmin;display:grid;place-items:center;font-size:min(8cqh,5.5cqw)}
.tf-cell .e{opacity:.35;transition:transform .2s,opacity .2s}
.tf-cell .e.lit{opacity:1;transform:scale(1.15)}
.boom-set{flex:none;font-size:clamp(14px,2.2vmin,24px)}
.boom-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;position:relative}
.boom-turn{font-size:clamp(20px,4.2vmin,48px);font-weight:900;color:var(--muted);min-height:1.3em}
.boom-num{font-size:clamp(90px,30vmin,330px);font-weight:900;line-height:1;color:var(--blue);text-shadow:0 1.2vmin 0 var(--ink)}
.boom-num.ready{font-size:clamp(50px,14vmin,160px);color:var(--ink);text-shadow:none}
.boom-num.isboom{color:var(--red);font-size:clamp(70px,22vmin,250px);animation:boomA .6s cubic-bezier(.3,1.7,.5,1)}
.boom-num.done{font-size:clamp(40px,10vmin,120px);color:var(--purple);text-shadow:none}
@keyframes boomA{0%{transform:scale(.2) rotate(-20deg)}60%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.boom-word{font-size:clamp(20px,5vmin,60px);font-weight:900;color:var(--muted);min-height:1.3em}
.shake-screen{animation:shake .5s}
.boom-strip{flex:none;display:flex;flex-wrap:wrap;gap:.6vmin;justify-content:center}
.bs{width:clamp(26px,4.6vmin,52px);height:clamp(26px,4.6vmin,52px);border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:clamp(12px,2vmin,22px);font-weight:900;background:#fff;opacity:.45}
.bs.past{opacity:1;background:#BDE0FE}.bs.bm{background:#FFD3D6}
.count-top{display:flex;align-items:center;justify-content:center;gap:2vmin;flex-wrap:wrap;flex:none}
.count-q{font-size:clamp(24px,5.4vmin,62px)}
.count-field{flex:1;min-height:0;position:relative;container-type:size;background:linear-gradient(#F1FAFF,#FFFFFF)}
.cnt-item{position:absolute;font-size:min(13cqh,8.5cqw);transform:translate(-50%,-50%);transition:transform .2s}
.cnt-item.lit{transform:translate(-50%,-50%) scale(1.22)}
.cnt-item.lit::after{content:attr(data-n);position:absolute;top:-22%;right:-22%;background:var(--red);color:#fff;border-radius:50%;font-size:.36em;min-width:1.6em;height:1.6em;display:grid;place-items:center;border:2px solid var(--ink);font-family:var(--font);font-weight:900}
.count-bottom{display:flex;align-items:center;justify-content:center;gap:3vmin;flex:none;flex-wrap:wrap}
.count-ans{font-size:clamp(24px,5.4vmin,62px);font-weight:900;color:var(--purple);min-width:30%;text-align:center}

/* ---------- body & monsters ---------- */
.bodyg{flex-direction:row;align-items:stretch}
.body-fig{flex:none;height:100%;aspect-ratio:540/620;max-width:55%}
.body-svg{width:100%;height:100%;display:block}
.body-svg .labels{opacity:0;transition:opacity .3s}
.body-svg.show-labels .labels{opacity:1}
.body-svg .labels text{font-family:var(--font);font-weight:900;font-size:22px;fill:var(--ink);paint-order:stroke;stroke:#FFF6E5;stroke-width:6px}
.body-svg .labels line{stroke:var(--ink);stroke-width:2;stroke-dasharray:4 4}
.ring{fill:rgba(255,210,63,.3);stroke:#FF5A5F;stroke-width:6;stroke-dasharray:14 8;transform-box:fill-box;transform-origin:center;animation:ringPulse .9s ease-in-out infinite}
@keyframes ringPulse{50%{transform:scale(1.15)}}
.body-side{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vmin;min-width:0;text-align:center}
.body-cmd{font-size:clamp(30px,7.5vmin,90px);font-weight:900;line-height:1.15}
.body-cmd .hl{color:var(--red);text-decoration:underline;text-decoration-thickness:.08em;text-underline-offset:.12em}
.monster{width:100%;height:100%;display:block;overflow:visible;animation:mbob 2.2s ease-in-out infinite}
@keyframes mbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5%)}}
.m-eyes{animation:mblink 4s infinite;transform-box:fill-box;transform-origin:center}

<body>
<header id="topbar"></header>
<main id="stage"></main>
<canvas id="fx"></canvas>
<div id="toast"></div>
<div id="mini"></div>
<div id="modal" hidden></div>
<script>
'use strict';
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const stage = $('#stage'), topbar = $('#topbar');
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const art = w => /^[aeiou]/i.test(w) ? 'an' : 'a';
const NUMW = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty','twenty-one','twenty-two','twenty-three','twenty-four','twenty-five','twenty-six','twenty-seven','twenty-eight','twenty-nine','thirty'];
const cnt = (n, s, p) => n === 0 ? `no ${p}` : `${NUMW[n]} ${n === 1 ? s : p}`;
const bump = el => { if (!el) return; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); };

/* timers owned by the current screen (cleared on every screen change) */
const T = {
  ids: new Set(),
  after(fn, ms) { const id = setTimeout(() => { T.ids.delete(id); fn(); }, ms); T.ids.add(id); return id; },
  every(fn, ms) { const id = setInterval(fn, ms); T.ids.add(id); return id; },
  clear(id) { if (id == null) return; clearTimeout(id); clearInterval(id); T.ids.delete(id); },
  clearAll() { T.ids.forEach(id => { clearTimeout(id); clearInterval(id); }); T.ids.clear(); }
};

const store = {
  get(k, d) { try { const v = localStorage.getItem('english-club-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('english-club-' + k, JSON.stringify(v)); } catch (e) { /* storage blocked: keep going */ } }
};
/* keep names/stars saved under the older key prefix */
try {
  for (const k of Object.keys(localStorage)) {
    const m = k.match(/^[a-z]+-ec-(names|stars|muted)$/);
    if (!m) continue;
    if (localStorage.getItem('english-club-' + m[1]) == null) localStorage.setItem('english-club-' + m[1], localStorage.getItem(k));
    localStorage.removeItem(k);
  }
} catch (e) { /* storage blocked */ }
let NAMES = store.get('names', []);
if (!Array.isArray(NAMES)) NAMES = [];
let STARS = +store.get('stars', 0) || 0;
let MUTED = !!store.get('muted', false);
const saveNames = () => store.set('names', NAMES);

const AVATARS = ['🦊','🐼','🐨','🐯','🦁','🐸','🐵','🐰','🐶','🐱','🐧','🦄','🐙','🦉','🐢','🐝','🦋','🐞','🐬','🦒','🐹','🐻','🐮','🐷'];
function avatarOf(n) { let h = 7; for (const ch of String(n)) h = (h * 31 + ch.codePointAt(0)) >>> 0; return AVATARS[h % AVATARS.length]; }

/* fair turn-taking: everybody gets a turn before anyone repeats */
let BAG = [];
function nextName(exclude) {
  if (!NAMES.length) return null;
  BAG = BAG.filter(n => NAMES.includes(n));
  if (!BAG.length) BAG = shuffle(NAMES);
  let i = BAG.findIndex(n => n !== exclude);
  if (i < 0) { BAG = shuffle(NAMES); i = BAG.findIndex(n => n !== exclude); if (i < 0) return NAMES[0]; }
  return BAG.splice(i, 1)[0];
}

/* ================= sound (Web Audio, works offline) ================= */
const SFX = (() => {
  let ctx = null, master = null, nbuf = null;
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ctx = new AC(); } catch (e) { return false; }
    master = ctx.createGain(); master.gain.value = MUTED ? 0 : 0.8;
    const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
    nbuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return true;
  }
  function env(g, t, vol, a, d, shape) {
    g.gain.setValueAtTime(0.0001, t);
    if (shape === 'pad') { g.gain.linearRampToValueAtTime(vol, t + a); g.gain.setValueAtTime(vol, t + Math.max(a, d - a)); g.gain.linearRampToValueAtTime(0.0001, t + d); }

  }

  }
  function noise({ t = 0, dur = .3, vol = .3, ft = 'lowpass', f = 1000, f2 = 0, q = 1, a = .005, shape = 'perc' }) {
    if (!init()) return null; const t0 = ctx.currentTime + t;
    const s = ctx.createBufferSource(); s.buffer = nbuf; s.loop = true;
    const fl = ctx.createBiquadFilter(); fl.type = ft; fl.frequency.setValueAtTime(f, t0); fl.Q.value = q;
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t0 + dur);

    s.connect(fl); fl.connect(g); g.connect(master); s.start(t0, Math.random() * 1.5); s.stop(t0 + dur + .05);

  }
  return {
    init,
    get ctx() { return ctx; }, get master() { return master; }, get noiseBuf() { return nbuf; },
    setMute(m) { if (master) master.gain.value = m ? 0 : .8; },
    pop() { tone({ f: 520, f2: 980, dur: .1, vol: .25 }); },
    tick() { tone({ f: 1500, dur: .03, vol: .07, type: 'square' }); },
    ding() { tone({ f: 880, dur: .3, vol: .22, type: 'triangle' }); tone({ f: 1320, dur: .4, vol: .18, type: 'triangle', t: .08 }); },
    tada() { [523, 659, 784, 1047].forEach((f, i) => tone({ f, dur: i === 3 ? .6 : .2, vol: .2, type: 'triangle', t: i * .08 })); tone({ f: 2093, dur: .5, vol: .05, t: .32 }); },
    wrong() { tone({ f: 240, f2: 150, dur: .25, vol: .12, type: 'square' }); },
    whoosh() { noise({ ft: 'bandpass', f: 300, f2: 3000, q: 1.5, dur: .4, vol: .35, a: .08, shape: 'pad' }); },
    boom() { noise({ f: 900, f2: 60, dur: 1.1, vol: .9 }); tone({ f: 110, f2: 32, dur: .9, vol: .8 }); },
    thunder() { noise({ f: 1400, f2: 70, dur: 2.6, vol: .9, a: .02 }); noise({ f: 300, dur: 2, vol: .6, t: .35, a: .2, shape: 'pad' }); tone({ f: 60, f2: 30, dur: 1.5, vol: .5 }); },
    rain(d = 3) { noise({ ft: 'highpass', f: 2500, dur: d, vol: .18, a: .5, shape: 'pad' }); noise({ ft: 'bandpass', f: 900, q: .7, dur: d, vol: .12, a: .5, shape: 'pad' }); for (let i = 0; i < 25; i++) tone({ f: 2000 + Math.random() * 3000, f2: 900, dur: .04, vol: .03, t: Math.random() * (d - .3) }); },
    wind(d = 3) { const fl = noise({ ft: 'bandpass', f: 250, q: 4, dur: d, vol: .6, a: d * .3, shape: 'pad' }); if (!fl) return; const t0 = ctx.currentTime; fl.frequency.linearRampToValueAtTime(900, t0 + d * .45); fl.frequency.linearRampToValueAtTime(350, t0 + d); },
    birds() { for (let k = 0; k < 3; k++) { const b = k * .55 + Math.random() * .2; for (let i = 0; i < 3; i++) tone({ f: 2400 + Math.random() * 800, f2: 3800 + Math.random() * 900, dur: .07, vol: .08, t: b + i * .11 }); } },
    chimes() { [1568, 1760, 2093, 2349, 2637].forEach((f, i) => tone({ f, dur: .8, vol: .07, type: 'triangle', t: i * .22 + Math.random() * .1 })); },
    sizzle() { noise({ ft: 'highpass', f: 4000, dur: 1.5, vol: .08, a: .3, shape: 'pad' }); },
    freeze() { tone({ f: 1800, f2: 220, dur: .55, vol: .18, type: 'triangle' }); noise({ ft: 'highpass', f: 6000, dur: .5, vol: .12 }); [2637, 3136, 3520].forEach((f, i) => tone({ f, dur: .3, vol: .06, t: .35 + i * .07 })); },
    boing() { tone({ f: 180, f2: 520, dur: .25, vol: .18 }); tone({ f: 520, f2: 260, dur: .2, vol: .12, t: .2 }); },
    count(i) { tone({ f: 440 * Math.pow(2, Math.min(i, 24) / 12), dur: .14, vol: .18, type: 'triangle' }); },
    drumroll(d = 1) { for (let t = 0; t < d; t += .05) noise({ ft: 'highpass', f: 1800, dur: .05, vol: .06 + t / d * .12, t }); },
    beep(hi) { tone({ f: hi ? 1320 : 660, dur: hi ? .45 : .12, vol: .14, type: 'square' }); }
  };
})();

/* ================= dance music (synthesised loop) ================= */
const MUSIC = (() => {
  let timer = null, g = null, step = 0, next = 0, bpm = 120, playing = false;
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  const CH = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]];           // C  Am  F  G
  const MEL = [76,79,81,79,76,74,72,74, 76,0,79,76,74,72,69,72, 72,74,77,76,74,72,69,0, 74,74,76,74,71,67,71,74];
  function osc(ctx, { f, type, t, dur, vol, lp }) {
    const o = ctx.createOscillator(), gg = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(vol, t + .008); gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = o; if (lp) { const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; o.connect(fl); node = fl; }
    node.connect(gg); gg.connect(g); o.start(t); o.stop(t + dur + .05);
  }
  function kick(ctx, t) { const o = ctx.createOscillator(), gg = ctx.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + .14); gg.gain.setValueAtTime(1, t); gg.gain.exponentialRampToValueAtTime(0.001, t + .3); o.connect(gg); gg.connect(g); o.start(t); o.stop(t + .32); }
  function nz(ctx, t, f, dur, vol) { const s = ctx.createBufferSource(); s.buffer = SFX.noiseBuf; const fl = ctx.createBiquadFilter(); fl.type = 'highpass'; fl.frequency.value = f; const gg = ctx.createGain(); gg.gain.setValueAtTime(vol, t); gg.gain.exponentialRampToValueAtTime(0.001, t + dur); s.connect(fl); fl.connect(gg); gg.connect(g); s.start(t, Math.random()); s.stop(t + dur + .02); }
  function playStep(ctx, s, t) {
    const bar = (s >> 4) & 3, st = s & 15, sp = 60 / bpm / 4;
    if (st % 4 === 0) kick(ctx, t);
    if (st === 4 || st === 12) nz(ctx, t, 1500, .16, .32);
    if (st % 2 === 0) nz(ctx, t, 7000, .04, st % 4 === 2 ? .12 : .05);
    const root = CH[bar][0] - 24;
    if ([0, 3, 6, 8, 11, 14].includes(st)) osc(ctx, { f: mf(st === 6 || st === 14 ? root + 12 : root), type: 'square', t, dur: sp * 1.6, vol: .22, lp: 500 });
    if (st === 2 || st === 6 || st === 10 || st === 14) CH[bar].forEach(n => osc(ctx, { f: mf(n), type: 'triangle', t, dur: .12, vol: .07 }));
    if (st % 2 === 0) { const m = MEL[bar * 8 + st / 2]; if (m) osc(ctx, { f: mf(m), type: 'square', t, dur: sp * 1.8, vol: .06, lp: 3000 }); }
  }
  function tick() { const ctx = SFX.ctx; if (!ctx || !playing) return; while (next < ctx.currentTime + .15) { playStep(ctx, step, next); next += 60 / bpm / 4; step = (step + 1) % 64; } }
  return {
    start(b = 120) { if (!SFX.init()) return; this.stop(); const ctx = SFX.ctx; bpm = b; g = ctx.createGain(); g.gain.value = .55; g.connect(SFX.master); step = 0; next = ctx.currentTime + .06; playing = true; timer = setInterval(tick, 25); tick(); },
    stop() { playing = false; if (timer) { clearInterval(timer); timer = null; } if (g) { const gg = g; try { gg.gain.setTargetAtTime(0, SFX.ctx.currentTime, .02); } catch (e) {} setTimeout(() => { try { gg.disconnect(); } catch (e) {} }, 300); g = null; } },
    get playing() { return playing; }
  };
})();

/* ================= optional pronunciation (needs an English voice on the PC) ================= */
const SPEAK = (() => {
  let voice = null;
  const ok = 'speechSynthesis' in window;
  function find() { if (!ok) return null; const en = speechSynthesis.getVoices().filter(v => /^en([-_]|$)/i.test(v.lang)); voice = en.find(v => /US/i.test(v.lang) && v.localService) || en.find(v => v.localService) || en[0] || null; return voice; }
  if (ok) { find(); speechSynthesis.onvoiceschanged = find; }
  const clean = t => String(t).replace(/<[^>]+>/g, '').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}️‍]/gu, '').replace(/_+/g, ' ').trim();
  let run = 0, pause = null;
  return {
    /* says the text `times` times, waiting `gap` ms between repeats */
    say(text, times = 1, gap = 900) {
      if (!ok) return mini('🔇 No voice on this computer');
      if (!voice) find();
      if (!voice) return mini('🔇 No English voice on this computer');
      this.stop();
      const my = ++run; let left = times;
      const once = () => {
        if (my !== run) return;
        const u = new SpeechSynthesisUtterance(clean(text)); u.voice = voice; u.lang = voice.lang; u.rate = .8; u.pitch = 1.1;
        u.onend = () => { if (--left > 0 && my === run) pause = setTimeout(once, gap); };
        speechSynthesis.speak(u);
      };
      once();
    },
    stop() { run++; clearTimeout(pause); if (ok) speechSynthesis.cancel(); }
  };
})();

/* ================= visual FX ================= */
const FX = (() => {
  const cv = $('#fx'), cx = cv.getContext('2d'); let parts = [], raf = 0;
  const COLS = ['#FF5A5F', '#FF9F1C', '#FFD23F', '#2EC4B6', '#3A86FF', '#8338EC', '#FF70A6', '#8AC926'];
  function size() { const d = window.devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; }
  addEventListener('resize', size); size();
  function loop() {
    const d = window.devicePixelRatio || 1; cx.setTransform(d, 0, 0, d, 0, 0); cx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
    for (const p of parts) {
      p.vy += p.g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.globalAlpha = Math.min(1, p.life / 30); cx.fillStyle = p.c;
      if (p.sq) cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); else { cx.beginPath(); cx.arc(0, 0, p.r / 2.5, 0, 7); cx.fill(); }
      cx.restore();
    }
    raf = parts.length ? requestAnimationFrame(loop) : 0;
    if (!raf) cx.clearRect(0, 0, innerWidth, innerHeight);
  }
  const run = () => { if (!raf) raf = requestAnimationFrame(loop); };
  return {
    burst(x = innerWidth / 2, y = innerHeight / 2, n = 110, cols = COLS) {
      for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 10; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 6, g: .25, r: 6 + Math.random() * 8, c: pick(cols), rot: Math.random() * 6, vr: (Math.random() - .5) * .4, life: 90 + Math.random() * 50, sq: Math.random() < .6 }); }
      run();
    },
    rain(n = 150) {
      for (let i = 0; i < n; i++) parts.push({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .6, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3, g: .06, r: 7 + Math.random() * 8, c: pick(COLS), rot: Math.random() * 6, vr: (Math.random() - .5) * .3, life: 220, sq: true });
      run();
    }
  };
})();

const PRAISE = ['Great job!', 'Perfect!', 'Well done!', 'Bravo!', 'Super!', 'Excellent!', 'Good job!', 'Amazing!'];
function bigToast(text, emoji = '') {
  const t = $('#toast'); t.innerHTML = `${esc(text)}${emoji ? ` <span class="e">${emoji}</span>` : ''}`;
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
}
let miniTimer = null;
function mini(text) { const m = $('#mini'); m.textContent = text; m.classList.add('show'); clearTimeout(miniTimer); miniTimer = setTimeout(() => m.classList.remove('show'), 2200); }
function celebrate(text, { star = true, emoji = '🎉', big = true, el = null } = {}) {
  SFX.tada();
  if (el) { const r = el.getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top + r.height / 2, 70); }
  else FX.burst();
  if (big) bigToast(text || pick(PRAISE), emoji);
  if (star) addStar();
}
function addStar(n = 1) {
  STARS += n; store.set('stars', STARS);
  const c = $('#starCount'); if (c) { c.textContent = STARS; const b = c.parentElement; b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
}

function startScene(id, root) {

/* ---------- monsters ---------- */
const MCOL = [{ w: 'green', h: '#6BCB77' }, { w: 'purple', h: '#A66CFF' }, { w: 'pink', h: '#FF7EB6' }, { w: 'orange', h: '#FF9F1C' }, { w: 'blue', h: '#4D96FF' }, { w: 'red', h: '#FF595E' }, { w: 'yellow', h: '#FFD93D' }];
const MNAMES = ['Zog', 'Bibo', 'Gloop', 'Fizz', 'Momo', 'Wobble', 'Snork', 'Pip', 'Blub', 'Ziggy', 'Tiki', 'Grumbo', 'Noodle', 'Bop', 'Fuzzy', 'Zuzu'];
function makeMonster(o = {}) {
  return { color: o.color || pick(MCOL), eyes: o.eyes ?? rand(1, 5), arms: o.arms ?? pick([0, 2, 2, 3, 4, 4, 6]), legs: o.legs ?? rand(1, 4), horns: o.horns ?? rand(0, 3), teeth: o.teeth ?? rand(0, 4), shape: o.shape || pick(['round', 'tall', 'wide']), name: o.name || pick(MNAMES), spots: Math.random() < .5 };
}
function monsterSVG(m) {
  const ink = '#2B2A4C', c = m.color.h, cx = 120, cy = 118;
  const [rx, ry] = { round: [68, 66], tall: [56, 80], wide: [84, 58] }[m.shape];
  const top = cy - ry, bot = cy + ry;
  let s = '';
  const spread = m.legs === 1 ? 0 : Math.min(rx * 1.3, 34 * (m.legs - 1));
  for (let i = 0; i < m.legs; i++) {
    const x = m.legs === 1 ? cx : cx - spread / 2 + spread * i / (m.legs - 1);
    s += `<rect x="${x - 9}" y="${bot - 20}" width="18" height="${250 - bot}" rx="8" fill="${c}" stroke="${ink}" stroke-width="4"/><ellipse cx="${x}" cy="250" rx="17" ry="9" fill="${c}" stroke="${ink}" stroke-width="4"/>`;
  }
  const arm = (side, k, n) => {
    const y0 = cy - 6 + (k - (n - 1) / 2) * 26;
    const dx = rx * Math.sqrt(Math.max(0, 1 - ((y0 - cy) / ry) ** 2)) * .9;
    const x0 = cx + side * dx, x1 = x0 + side * 46, y1 = y0 - 22;
    const d = `M${x0.toFixed(1)} ${y0.toFixed(1)} Q${(x0 + side * 34).toFixed(1)} ${(y0 + 16).toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}`;
    return `<path d="${d}" stroke="${ink}" stroke-width="16" fill="none" stroke-linecap="round"/><path d="${d}" stroke="${c}" stroke-width="8" fill="none" stroke-linecap="round"/><circle cx="${x1.toFixed(1)}" cy="${y1.toFixed(1)}" r="9" fill="${c}" stroke="${ink}" stroke-width="4"/>`;
  };
  const nl = Math.ceil(m.arms / 2), nr = Math.floor(m.arms / 2);
  for (let k = 0; k < nl; k++) s += arm(-1, k, nl);
  for (let k = 0; k < nr; k++) s += arm(1, k, nr);
  for (let i = 0; i < m.horns; i++) {
    const off = i - (m.horns - 1) / 2, x = cx + off * 36, yb = top + 14 + Math.abs(off) * 10;
    s += `<path d="M${x - 11} ${yb} L${x + off * 10} ${yb - 40} L${x + 11} ${yb} Z" fill="#FFF1C1" stroke="${ink}" stroke-width="4" stroke-linejoin="round"/>`;
  }
  s += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${c}" stroke="${ink}" stroke-width="5"/>`;
  s += `<ellipse cx="${cx}" cy="${cy + ry * .45}" rx="${rx * .55}" ry="${ry * .36}" fill="#fff" opacity=".3"/>`;
  if (m.spots) s += `<circle cx="${cx - rx * .6}" cy="${cy + ry * .12}" r="7" fill="${ink}" opacity=".13"/><circle cx="${cx + rx * .62}" cy="${cy - ry * .02}" r="5" fill="${ink}" opacity=".13"/><circle cx="${cx + rx * .4}" cy="${cy + ry * .62}" r="6" fill="${ink}" opacity=".13"/>`;
  const er = [0, 24, 18, 15, 13, 12][m.eyes];
  const rows = m.eyes <= 3 ? [m.eyes] : m.eyes === 4 ? [2, 2] : [3, 2];
  const ey0 = cy - ry * .4;
  let eyes = '';
  rows.forEach((n, ri) => {
    const y = ey0 + ri * er * 2.2 - (rows.length - 1) * er * 1.1;
    for (let i = 0; i < n; i++) {
      const x = cx + (i - (n - 1) / 2) * er * 2.4;
      eyes += `<circle cx="${x}" cy="${y}" r="${er}" fill="#fff" stroke="${ink}" stroke-width="4"/><circle cx="${x + er * .15}" cy="${y + er * .1}" r="${er * .48}" fill="${ink}"/><circle cx="${x + er * .3}" cy="${y - er * .12}" r="${er * .16}" fill="#fff"/>`;
    }
  });
  s += `<g class="m-eyes">${eyes}</g>`;
  const my = cy + ry * .36, mw = Math.min(34, rx * .5);
  s += `<path d="M${cx - mw} ${my} Q${cx} ${my + mw * 1.1} ${cx + mw} ${my} Z" fill="#7A1F3D" stroke="${ink}" stroke-width="4" stroke-linejoin="round"/>`;
  for (let i = 0; i < m.teeth; i++) {
    const x = m.teeth === 1 ? cx : cx - mw * .6 + mw * 1.2 * i / (m.teeth - 1);
    s += `<path d="M${x - 6} ${my} L${x + 6} ${my} L${x} ${my + 11} Z" fill="#fff" stroke="${ink}" stroke-width="2" stroke-linejoin="round"/>`;
  }
  return `<svg class="monster" viewBox="-20 0 280 268">${s}</svg>`;
}

/* card grid → click a card to open a big "detail" page with ‹ › arrows */
function learnGrid(st, { items, cols, rows, card, detail, say, onShow, detailCls = '' }) {
  st.innerHTML = `<div class="screen"><div class="lgrid" style="--cols:${cols};--rows:${rows}">${items.map((it, i) => `<button class="lcard" data-i="${i}">${card(it, i)}</button>`).join('')}</div><div class="detail ${detailCls}" hidden></div></div>`;
  const grid = $('.lgrid', st), det = $('.detail', st);
  let idx = -1, cleanup = null;
  function open(i) {
    idx = (i + items.length) % items.length; const it = items[idx];
    if (cleanup) { cleanup(); cleanup = null; }
    SPEAK.stop();
    det.innerHTML = `<div class="det-body">${detail(it, idx)}</div><button class="nav-arrow left" data-nav="-1">‹</button><button class="nav-arrow right" data-nav="1">›</button><div class="det-tools">${say ? '<button class="btn" data-say title="Pronounce">🔊</button>' : ''}<button class="btn" data-close title="All cards (Esc)">✕</button></div>`;
    det.hidden = false; SFX.pop();
    if (onShow) cleanup = onShow(it, det) || null;
  }
  function close() { if (cleanup) { cleanup(); cleanup = null; } SPEAK.stop(); det.hidden = true; det.innerHTML = ''; idx = -1; }
  grid.onclick = e => { const b = e.target.closest('.lcard'); if (b) open(+b.dataset.i); };
  det.onclick = e => {
    const n = e.target.closest('[data-nav]'); if (n) return open(idx + +n.dataset.nav);
    if (e.target.closest('[data-close]')) return close();
    if (e.target.closest('[data-say]')) return SPEAK.say(say(items[idx]), 2);   // the word, twice
  };
  return {
    next() { open(idx + 1); }, action() { open(idx + 1); },
    prev() { open(idx < 0 ? items.length - 1 : idx - 1); },
    back() { if (idx >= 0) { close(); return true; } return false; },
    destroy() { if (cleanup) cleanup(); }
  };
}

/* picture hidden under 16 numbered tiles — kids call numbers and guess */
function peekGame(st, { pool, content, answer, prompt, frameQ, hint, onReveal }) {
  let bag = [], item = null, revealed = false, cleanup = null;

  }

function monsterWhich(st) {
  let ms = [], t = 0, clues = [], shown = 0, solved = false;
  const KEYS = ['eyes', 'arms', 'legs', 'horns'];
  const SING = { eyes: 'eye', arms: 'arm', legs: 'leg', horns: 'horn' };
  st.innerHTML = `<div class="screen mwhich">
    <div class="mw-top"><div class="bubble mw-q" id="mwQ"></div><div class="mw-clues" id="mwC"></div></div>

  const q = $('#mwQ', st), C = $('#mwC', st), row = $('#mwRow', st), nextBtn = $('#mwNext', st);
  function gen() {
    const cols = shuffle(MCOL).slice(0, 4);
    for (let tries = 0; tries < 300; tries++) {
      ms = cols.map(c => makeMonster({ color: c, eyes: rand(1, 3), arms: pick([0, 2, 4]), legs: rand(1, 4), horns: rand(0, 2), teeth: rand(0, 3) }));

      if (ms.some((m, i) => i !== t && KEYS.every(k => m[k] === tg[k]))) continue;
      clues = shuffle(KEYS);
      if (ms.filter(m => m[clues[0]] === tg[clues[0]]).length < 2 && tries < 250) continue;
      break;
    }
    shown = 0; solved = false;
    q.innerHTML = 'Listen! Which monster is it? <span class="e">🕵️</span>'; C.innerHTML = '';
    row.innerHTML = ms.map((m, i) => `<button class="mw-card" data-i="${i}"><span class="mw-n">${i + 1}</span><div class="mw-fig">${monsterSVG(m)}</div></button>`).join('');

/* red-white pennant garland hanging between (0,y0) and (w,y0) */
function bunting(w, y0, sag) {
  const ink = '#2B2A4C', n = Math.round(w / 40);
  let s = `<path d="M0 ${y0} Q${w / 2} ${y0 + 2 * sag} ${w} ${y0}" stroke="${ink}" stroke-width="2.5" fill="none"/>`;

}

/* one cartoon person; pose: 'flag' (waves a small flag) | 'cheer' (both arms up) | 'drum'; ground = y of the feet (draws legs) */
const REP_SKIN = ['#F2C3A0', '#C68A5C', '#E0A97E', '#F5D0B5', '#A86B45'];
const REP_HAIR = ['#3E2723', '#212121', '#6D4C41', '#8D6E63', '#4E342E'];

function repPerson(x, hy, r, i, pose, delay, ground) {

  const sy = hy + r * 1.05, bw = r * 1.4, aw = r * .42, bottom = ground ? hy + r * 3.4 : 400;
  const limb = (x1, y1, x2, y2) => `<path d="M${f1(x1)} ${f1(y1)} L${f1(x2)} ${f1(y2)}" stroke="${ink}" stroke-width="${f1(aw + 5)}" stroke-linecap="round"/><path d="M${f1(x1)} ${f1(y1)} L${f1(x2)} ${f1(y2)}" stroke="${skin}" stroke-width="${f1(aw)}" stroke-linecap="round"/>`;

function openPicker(spin) {
  if (!NAMES.length) return openNames();
  const box = MODAL.show(`<h2>Who's next? <span class="e">🎯</span></h2><div class="slot" id="slot"><div class="slot-name" id="slotName">?</div></div>
    <div class="row"><button class="btn y big" id="spinBtn">🎲 Pick!</button><button class="btn" id="editNames">✏️ Names (${NAMES.length})</button></div>`, e => { if (e.key === ' ' || e.key === 'Enter' || e.key === 'n' || e.key === 'N') { doSpin(); return true; } return false; });
  const slot = $('#slot', box), nameEl = $('#slotName', box);
  let spinning = false;
  function doSpin() {
    if (spinning) return; spinning = true; slot.classList.remove('win');
    const final = nextName(); let i = 0; const steps = 22;
    const tick = () => {
      if (i >= steps) { nameEl.innerHTML = `<span class="e">${avatarOf(final)}</span>${esc(final)}`; slot.classList.add('win'); spinning = false; SFX.tada(); FX.burst(); return; }
      const n = NAMES.length > 1 ? pick(NAMES.filter(x => x !== nameEl.dataset.n)) : NAMES[0];
      nameEl.dataset.n = n; nameEl.innerHTML = `<span class="e">${avatarOf(n)}</span>${esc(n)}`; SFX.tick();
      i++; MODAL.later(tick, 40 + i * i * .45);
    };
    tick();
  }
  $('#spinBtn', box).onclick = doSpin;
  $('#editNames', box).onclick = openNames;
  if (spin) doSpin();
}
function openHelp() {
  const box = MODAL.show(`<h2><span class="e">📘</span> Öğretmen rehberi</h2>
    <div class="help-grid">
      <div><kbd>Boşluk</kbd> <kbd>Enter</kbd> <kbd>→</kbd></div><div>Sonraki / göster / başlat (her oyunun ana düğmesi)</div>
      <div><kbd>←</kbd></div><div>Önceki kart (Learn ekranlarında)</div>
      <div><kbd>1</kbd> … <kbd>9</kbd> <kbd>0</kbd></div><div>Ana sayfada konu seç · konu içinde sekme seç</div>
      <div><kbd>Esc</kbd></div><div>Geri · ana sayfa</div>
      <div><kbd>N</kbd></div><div>Sıradaki öğrenci (isim çekilişi 🎯)</div>
      <div><kbd>F</kbd> &nbsp; <kbd>M</kbd></div><div>Tam ekran · ses aç/kapa</div>
    </div>
    <p class="help-note">💡 Derse <b>Hello!</b> ile başla: her çocuk “My name is …” desin, sen ismi yazıp Enter'a bas. İsimler kaydedilir; <b>Talk Time</b>, <b>How are you?</b>, <b>BOOM</b>, <b>I spy</b> ve 🎯 çekiliş sırayı herkese eşit dağıtır.<br>
    💡 Konuşturma sırası: önce sen modelle → hep birlikte tekrar (choral) → tek tek (chain drill). Tam cümle şart değil, “Hungry!” da harika bir cevap.<br>
    💡 Bütün oyunlar internetsiz çalışır. Telaffuz düğmesi 🔊 sadece bilgisayarda İngilizce ses yüklüyse konuşur.</p>
    <div class="row"><button class="btn" id="hNames">👥 İsimleri düzenle</button><button class="btn" id="hStars">⭐ Yıldızları sıfırla (${STARS})</button></div>`);
  $('#hNames', box).onclick = openNames;
  $('#hStars', box).onclick = () => { STARS = 0; store.set('stars', 0); const c = $('#starCount'); if (c) c.textContent = 0; MODAL.close(); mini('⭐ Stars reset'); };
}

/* ================= keyboard ================= */
addEventListener('pointerdown', () => SFX.init(), true);
addEventListener('click', e => { if (e.target.closest('button')) setTimeout(() => { const a = document.activeElement; if (a && a.tagName === 'BUTTON') a.blur(); }, 0); }, true);
addEventListener('keydown', e => {
  SFX.init();
  if (e.target.matches && e.target.matches('input, textarea')) { if (e.key === 'Escape') { e.target.blur(); if (MODAL.open) MODAL.close(); } return; }
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  const k = e.key;
  if (MODAL.open) { if (k === 'Escape' || (MODAL.onKey && MODAL.onKey(e))) e.preventDefault(); if (k === 'Escape') MODAL.close(); return; }
  const inst = current.inst || {};
  if (inst.key && inst.key(e)) { e.preventDefault(); return; }
  if (k === 'Escape' || k === 'Backspace') { if (!(inst.back && inst.back()) && current.topic) go(null); }
  else if (k === ' ' || k === 'Enter' || k === 'PageDown') (inst.action || inst.next || (() => {}))();
  else if (k === 'ArrowRight') (inst.next || inst.action || (() => {}))();
  else if (k === 'ArrowLeft' || k === 'PageUp') inst.prev && inst.prev();
  else if (k === 'f' || k === 'F') toggleFS();
  else if (k === 'n' || k === 'N') openPicker(true);
  else if (k === 'm' || k === 'M') toggleMute();
  else if (k === '?' || k === 'h' || k === 'H') openHelp();
  else if (/^[0-9]$/.test(k)) {
    const i = (+k + 9) % 10;
    if (!current.topic) { if (TOPICS[i]) go(TOPICS[i].id); }
    else { const tp = TOPICS.find(t => t.id === current.topic); if (tp.modes[i]) go(tp.id, tp.modes[i].id); }
  } else return;
  e.preventDefault();
});

/* ================= start ================= */
(() => { const [t, m] = decodeURIComponent(location.hash.slice(1)).split('/'); go(t || null, m); })();
</script>
